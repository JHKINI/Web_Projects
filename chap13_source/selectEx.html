<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
/* 1. ol 바로 아래 span (직계 자식) */
ol>span {
		color:blue
}
/* 2. li 다음 li (바로 이어진 형제) */
li+li
{
		font-size: 15px;
		font-style: italic;
}
/* 3. ol 안에 있는 모든 li */
ol li {
    background-color: #f2f2f2;
}
/* 4. 첫 번째 li */
li:first-child {
    font-weight: bold;
}

/* 5. 앞에서 2개 li */
li:nth-child(-n+2) {
    font-style: italic;
}

/* 6. 모든 span (하위 포함) */
div span {
    text-decoration: underline;
}
</style>
<body>
    <div>
	<strong>연수생 수칙</strong>
		<ol>
			<li>지각하지 않기</li>
			<li>결석하지 않기</li>
			<span>(불가피할 땐 꼭 담당연구원에게 미리 말하기)</span>
			<li>복습하기</li>
		</ol>
    </div>
</body>
</html>
