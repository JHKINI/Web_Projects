<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>text-shadow</title>
  <style>    
    h1 { 
      font-size:60px;
    } 
    /* Do it! text-shadow 속성으로 텍스트 그림자 추가하기 */
    .shadow1{
      color: red;
      text-shadow: 1px 1px rgb(41,214,50);
    }
    .trans1{
      color : rgb(104, 182, 206);
      text-transform: capitalize;
    }
    .trans2{
      color: violet;
      text-transform: lowercase;
    }
    .trans3{
      color: rgb(103, 128, 197);
      text-transform: full-width;
    }
  </style>
</head>
<body>
  <h1 class="shadow1">HTML</h1> 
  <h1 class="trans2">CSS</h1>
  <h1 class="trans3">JAVASCRIPT</h1>
</body>
</html>
