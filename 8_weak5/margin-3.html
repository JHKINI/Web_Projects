<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>박스모델 - 마진 중첩</title>
	<style>
    * {
      box-sizing:border-box;
    }
		div {
			width:200px;  /* 너비 */
			height:100px;  /* 높이 */
      /* Do it! 마진 추가하기 */
      margin: 15px; /* 30px을 표시하고 싶을때 마진중첩현상을 고려한 수정*/
      display: inline-block;
		}
    #box1 {
      background:rgb(0, 77, 243);
      /*margin: 50px; 비대칭적인 마진 주의*/
    }
    #box2 {
      background:rgb(255, 72, 0);
    }
    #box3 {
      background:rgb(18, 219, 0);
    }
	</style>
</head>
<body>
	<div id="box1"></div>
	<div id="box2"></div>
	<div id="box3"></div>
</body>
</html>
