<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            width: 1000px;
            margin: 10px auto;
        }
        div{
            width: 100px;
            height: 100px;
            border: 1px solid orange;
            display: inline-block;
           
        }
        .box1{ 
            border-radius : 50%
         }
        .box2{ 
            border-top-right-radius : 40px;
            border-bottom-left-radius : 40px

         }
        .box3{ 
            border-radius : 25px
         }
        .box4{ 
            border-radius : 25px 0px
         }

    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
</body>
</html>
